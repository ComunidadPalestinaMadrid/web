name: Deploy web a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Prepara el sitio de Pages y lo crea si aun no existe.
      #
      # OJO: sus salidas (origin, base_path) NO se usan para compilar. La
      # accion deduce la ruta base del html_url de la API, y con un dominio
      # propio puede devolver la ruta del repositorio (/web) en lugar de la
      # raiz, lo que romperia todos los assets (actions/configure-pages#67).
      # Por eso el dominio y el prefijo se fijan en astro.config.mjs.
      #
      # Si el token no tuviera permiso para crear el sitio, habria que
      # activarlo a mano UNA vez en Settings > Pages > Source: GitHub Actions.
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Compilar Astro
        run: npm run build

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
